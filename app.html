<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vingeo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra laterale con le sezioni del vigneto + colonna di lavoro larga (max 1180px); su telefono la barra diventa una fila di schede scorrevole in alto */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#eaede5; --fg:#1b221e; --muted:#5a645d; --line:#d9ded3;
  --accent:#15706a; --accent-ink:#ffffff; --accent-soft:#d8ede9;
  --must:#9a700f; --must-soft:#f4e8cc; --grape:#86293a; --grape-soft:#f3dce0;
  --s4:#45679f; --s5:#5f8526;
  --ok:#2a7849; --ok-soft:#dbefe2; --warn:#9d5c06; --warn-soft:#fbebcf; --crit:#b3261e; --crit-soft:#f8dcd9;
  --shadow:0 1px 2px rgb(20 32 26 / .06), 0 6px 18px rgb(20 32 26 / .05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201c; --surface-2:#212a25; --fg:#e5eae4; --muted:#98a39b; --line:#2c3631;
  --accent:#55b8ae; --accent-ink:#0b1d1b; --accent-soft:#1b3532;
  --must:#d9ab4b; --must-soft:#3a2f17; --grape:#d9788a; --grape-soft:#3d1f26;
  --s4:#8aa8e0; --s5:#9bc45e;
  --ok:#6fc490; --ok-soft:#173326; --warn:#e7a947; --warn-soft:#3a2a12; --crit:#f2766b; --crit-soft:#3f1c19;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201c; --surface-2:#212a25; --fg:#e5eae4; --muted:#98a39b; --line:#2c3631;
  --accent:#55b8ae; --accent-ink:#0b1d1b; --accent-soft:#1b3532;
  --must:#d9ab4b; --must-soft:#3a2f17; --grape:#d9788a; --grape-soft:#3d1f26;
  --s4:#8aa8e0; --s5:#9bc45e;
  --ok:#6fc490; --ok-soft:#173326; --warn:#e7a947; --warn-soft:#3a2a12; --crit:#f2766b; --crit-soft:#3f1c19;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-block:22px;display:flex;flex-direction:column;gap:18px;height:calc(100vh - env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;margin-top:-2px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px}
main{padding-block:26px 64px;min-width:0;display:flex;flex-direction:column;gap:22px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:sticky;height:auto;padding-block:12px 8px;gap:10px;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav .grp,.side-foot{display:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  h1{font-size:1.5rem}
}

/* blocchi comuni */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.ph .sub{color:var(--muted);margin-top:4px;max-width:70ch}
.ph-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:17px;height:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:1rem;display:flex;align-items:center;gap:8px}
.card-h a{font-size:.85rem;text-decoration:none}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.white b{color:var(--must)} .kpi.red b{color:var(--grape)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
.code{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.white{background:var(--must-soft);color:var(--must)} .pill.red{background:var(--grape-soft);color:var(--grape)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:1.05rem}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:.9rem;border:1px solid}
.banner>span{flex:1 1 220px;min-width:0}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.banner .btn{margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* dashboard */
.band{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:22px 24px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
.band .eyebrow{color:inherit;opacity:.8}
.band h1{font-size:2.1rem;margin-top:4px}
.band .when{font-size:.9rem;opacity:.85;text-align:right}
.band svg.rows{position:absolute;right:-20px;bottom:-30px;opacity:.13;width:300px;height:160px;pointer-events:none}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--muted)}
.alert.crit{border-left-color:var(--crit)} .alert.warn{border-left-color:var(--warn)} .alert.ok{border-left-color:var(--ok)}
.alert b{display:block;font-weight:600}
.alert span{font-size:.85rem;color:var(--muted)}
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wx .d{text-align:center;padding:8px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8rem}
.wx .d.today{background:var(--accent-soft);color:var(--accent)}
.wx .d.past{opacity:.72}
.wx svg{width:24px;height:24px}
.wx .tx{font-family:var(--f-mono);font-weight:500;font-size:.95rem;color:var(--fg)}
.wx .tn{font-family:var(--f-mono);color:var(--muted);font-size:.78rem}
.wx .rn{font-family:var(--f-mono);color:var(--s4);font-size:.72rem}
@media (max-width:520px){.wx{grid-template-columns:repeat(4,minmax(0,1fr))}}
.risk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.risk .r{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.risk .r.alto{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.risk .r.medio{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.risk .r b{font-weight:600}
.risk .r p{font-size:.78rem;color:var(--muted)}
@media (max-width:600px){.risk{grid-template-columns:minmax(0,1fr)}}
.lvl{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.lvl.alto{color:var(--crit)} .lvl.medio{color:var(--warn)} .lvl.basso{color:var(--ok)} .lvl.riposo{color:var(--muted)}
.ripe-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ripe-row:last-child{border-bottom:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feed{list-style:none;margin:0;padding:0}
.feed li:last-child{border-bottom:0}
.feed .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);width:84px;flex:none}

/* barre */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;align-items:center;gap:10px;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;border-radius:6px}
.bar-row:hover .bar i{filter:brightness(1.1)}
.bar-row[aria-pressed="true"] .lab{font-weight:600}
.bar{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
@media (max-width:520px){.bar-row{grid-template-columns:100px minmax(0,1fr) 60px}}
.cu-bar{position:relative;height:12px;background:var(--surface-2);border-radius:4px;min-width:120px}
.cu-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.cu-bar i.warn{background:var(--warn)} .cu-bar i.crit{background:var(--crit)}
.cu-bar::after{content:"";position:absolute;right:0;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}

/* trattamenti */
.plist{display:flex;flex-direction:column;gap:10px}
.pl,.pl-h{display:grid;grid-template-columns:minmax(150px,1fr) 92px 56px 56px 96px;gap:2px 12px;align-items:baseline}
.pl-h span{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pl-h span:nth-child(n+2),.pl .q,.pl .r{text-align:right}
.pl .nm{font-weight:600}
.pl .meta{font-size:.78rem;color:var(--muted);grid-column:1/-1}
.pl .q,.pl .r{font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.pl .b{text-align:right}
.blk{font-size:.85rem;line-height:1.35}
.blk div{margin-bottom:3px}
.blk .sum{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tr-when b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.88rem}
.tr-when span{display:block;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.88rem;background:var(--surface);user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* modale */
#modal{position:fixed;inset:0;z-index:50;background:rgb(10 16 13 / .5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal[hidden],#toast[hidden]{display:none}
.fasce-week{overflow-x:auto}
.fasce-week table{border-collapse:separate;border-spacing:3px;font-size:.85rem;min-width:420px}
.fasce-week th{background:none;border:0;padding:4px 6px;text-align:center;font-size:.72rem}
.fasce-week tbody th{text-align:left;padding:0}
.dbtn{border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap;text-align:left;width:100%}
.fasce-week tr.sel .dbtn{background:var(--accent-soft);color:var(--accent)}
td.wk{border:0;padding:8px 4px;text-align:center;border-radius:6px;cursor:pointer;font-weight:600;min-width:56px}
td.wk.l0{background:var(--ok-soft);color:var(--ok)} td.wk.l1{background:var(--warn-soft);color:var(--warn)} td.wk.l2{background:var(--crit-soft);color:var(--crit)}
td.wk.past{opacity:.35} td.wk.na{background:var(--surface-2)}
.fasce-det{table-layout:fixed} .fasce-det th:first-child{width:210px}
.fasce-det th[scope=row]{text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--fg);font-weight:500;background:var(--surface);white-space:nowrap}
td.fc{text-align:center;border-left:2px solid var(--surface)} td.fc b{display:block;font-size:.8rem} td.fc span{font-size:.85rem;font-weight:600}
td.fc.l0{background:var(--ok-soft);color:var(--ok)} td.fc.l1{background:var(--warn-soft);color:var(--warn)} td.fc.l2{background:var(--crit-soft);color:var(--crit)}
.legend-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;margin-top:14px}
@media (max-width:700px){.legend-r{grid-template-columns:minmax(0,1fr)}}
.lett-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin-top:6px;font-size:.82rem;color:var(--muted)}
.lett-l b{color:var(--fg);margin-right:4px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc-head,.acc-row{display:grid;grid-template-columns:22px 92px minmax(0,1.3fr) minmax(0,1.2fr) 90px 64px minmax(0,1.3fr) 130px 76px;gap:12px;align-items:center;padding:10px 14px}
.acc-head{background:var(--surface-2);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.acc-head .r,.acc-row .c-ha,.acc-row .c-anno{text-align:right}
.acc-item{border-bottom:1px solid var(--line)} .acc-item:last-child{border-bottom:0}
.acc-row{cursor:pointer;font-size:.92rem}
.acc-row:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.acc-row>span{min-width:0;display:flex;flex-direction:column}
.acc-row .c-code,.acc-row .c-bacca{flex-direction:row;flex-wrap:wrap;gap:4px;align-items:center}
.acc-row .c-act{flex-direction:row;justify-content:flex-end}
.chev{color:var(--muted);transition:transform .15s}
.chev svg{width:18px;height:18px}
.acc-item.open .chev{transform:rotate(90deg);color:var(--accent)}
.acc-item.open>.acc-row{background:var(--accent-soft)}
.acc-body{padding:16px;border-top:1px solid var(--line);background:var(--bg)}
@media (max-width:860px){

function restrizioni(now=new Date()){
  const out={};
  for(const t of S.trattamenti){
    const end=parseD(t.fine||t.inizio); if(!end) continue;
    for(const l of (t.prodotti||[])){
      const p=l.snap||snapProd(prodBy(l.prodId)); const car=num(p.carenza), rie=num(p.rientro);
      for(const a of (t.appIds||[])){
        const o=out[a]||(out[a]={});
        if(car!=null){const u=addDays(end,car);u.setHours(0,0,0,0);if(!o.car||u>o.car){o.car=u;o.carP=p.nome}}
        if(rie!=null){const u=new Date(end.getTime()+rie*36e5);if(!o.rie||u>o.rie){o.rie=u;o.rieP=p.nome}}
      }
    }
  }
  return Object.entries(out).map(([id,o])=>({id,...o,carOn:o.car&&o.car>now,rieOn:o.rie&&o.rie>now})).filter(x=>x.carOn||x.rieOn).sort((a,b)=>appCode(a.id).localeCompare(appCode(b.id)));
}
function rameAnno(appId,y){

  for(const t of S.trattamenti){ if(!(t.appIds||[]).includes(appId)) continue; if(!t.inizio||+t.inizio.slice(0,4)!==y) continue;

}

function meteoSorted(){const have=new Set(S.meteo.map(m=>m.data)); const arch=[]; for(const a of S.meteoArchivio) for(const g of (a.giornaliero||[])) if(g.data&&!have.has(g.data)){have.add(g.data);arch.push({...g,arch:true,fonte:'stima'})}
  return [...S.meteo.filter(m=>m.data),...arch].sort((a,b)=>a.data.localeCompare(b.data))}
function giorniOrari(){const m=new Map(); for(const a of S.meteoArchivio) for(const g of (a.giorni||[])) if(g.data&&Array.isArray(g.ore)) m.set(g.data,{data:g.data,ore:g.ore,modello:g.modello||a.modello||''}); for(const d of S.meteoOre) if(d.data&&Array.isArray(d.ore)) m.set(d.data,d); return [...m.values()].sort((a,b)=>a.data.localeCompare(b.data))}
function rischi(){
  const m=meteoSorted(); if(!m.length) return null;
  const now=new Date(), t=today();
  const from=isoDay(addDays(now,-7)), to=isoDay(addDays(now,3));
  const win=m.filter(x=>x.data>=from&&x.data<=to);
  const past=m.filter(x=>x.data>=from&&x.data<=t);
  if(!win.length) return {nodata:true};
  const mo=now.getMonth()+1, fase=faseAzienda();
  const riposo=(mo>=11||mo<=2);
  const R={};
  if(riposo){
    const r={lvl:'riposo',txt:'Riposo vegetativo: indice non calcolato'};
    return {per:r,oid:r,bot:r};
  }
  // Peronospora – regola dei tre 10
  let alto=0,medio=0,bestDay=null;
  win.forEach((d,i)=>{
    const prev=m[m.indexOf(d)-1]; const r2=(num(d.pioggia)||0)+(prev&&parseD(prev.data)&&daysBetween(prev.data,d.data)===1?(num(prev.pioggia)||0):0);
    const tn=num(d.tmin);
    if(r2>=10&&tn!=null&&tn>=10){alto++;bestDay=bestDay||d.data}
    else if((r2>=10&&tn!=null&&tn>=8)||(r2>=5&&tn!=null&&tn>=10)) medio++;
  });
  if(fase>=0&&fase<4) R.per={lvl:'basso',txt:'Germogli sotto i 10 cm (fase prima di E): condizioni non complete'};
  else if(alto) R.per={lvl:'alto',txt:`Regola dei 3-10 soddisfatta (≥10 mm in 48 h, minima ≥10 °C) il ${fDs(bestDay)}`};
  else if(medio) R.per={lvl:'medio',txt:`${medio} giorni con pioggia o temperature vicine alla soglia`};
  else R.per={lvl:'basso',txt:'Nessuna pioggia infettante con minime ≥10 °C'};
  // Oidio – giorni con massime 21–30 °C
  const od=past.filter(d=>{const x=num(d.tmax);return x!=null&&x>=21&&x<=30}).length;
  const hot=past.filter(d=>(num(d.tmax)||0)>=35).length;
  if(fase>12) R.oid={lvl:'basso',txt:`Grappoli invaiati, poco recettivi (${od} gg a 21–30 °C)`};
  else if(od>=4&&!hot) R.oid={lvl:'alto',txt:`${od} giorni su ${past.length} con massime tra 21 e 30 °C`};
  else if(od>=2) R.oid={lvl:'medio',txt:`${od} giorni su ${past.length} con massime tra 21 e 30 °C`};
  else R.oid={lvl:'basso',txt:`${od} giorni con massime tra 21 e 30 °C`};
  // Botrite – pioggia/umidità con 15–28 °C in fasi recettive
  const bd=past.filter(d=>{const x=num(d.tmax);const wet=(num(d.pioggia)||0)>=2||(num(d.umidita)||0)>=88;return wet&&x!=null&&x>=15&&x<=28}).length;
  const recett=(fase===8||fase===9||fase>=12);
  if(fase>=0&&!recett) R.bot={lvl:'basso',txt:`Fase poco recettiva (${bd} gg umidi e miti)`};
  else if(bd>=3) R.bot={lvl:'alto',txt:`${bd} giorni umidi con 15–28 °C in fase recettiva`};
  else if(bd>=1) R.bot={lvl:'medio',txt:`${bd} giorni umidi con 15–28 °C in fase recettiva`};
  else R.bot={lvl:'basso',txt:'Nessun giorno umido con temperature miti'};
  return R;
}

/* finestre di trattamento da dati orari */
function deltaT(t,rh){const tw=t*Math.atan(0.151977*Math.sqrt(rh+8.313659))+Math.atan(t+rh)-Math.atan(rh-1.676331)+0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh)-4.686035;return t-tw}
function oreFlat(){
  const out=[];
  giorniOrari().forEach(d=>d.ore.forEach(o=>out.push({...o,data:d.data,k:d.data+'T'+pad(o.h)})));
  return out;
}
const RESTR={A:'Superficie fogliare bagnata',D:'Temperatura troppo alta',F:'Rischio di evaporazione',R:'Pioggia',T:'Temperatura troppo bassa',U:'Vento quasi assente (deriva, inversione termica)',V:'Ventoso',X:'Rischi multipli'};
function valutaOra(o,rainNext,rainPrev){
  let lvl=0;const why=[];const L=new Set();const up=(l,k,r)=>{if(l>lvl)lvl=l;L.add(k);why.push(r)};
  const p=num(o.p)||0,pp=num(o.pp),v=num(o.v),g=num(o.g),t=num(o.t),rh=num(o.rh),td=num(o.td),et=num(o.et0);
  if(p>=0.2) up(2,'R',`pioggia ${nf(p,1)} mm`); else if(rainNext>=0.2) up(1,'R','pioggia nelle 2 ore successive'); else if(pp!=null&&pp>=60) up(1,'R',`probabilità di pioggia ${Math.round(pp)}%`);
  if(p<0.2&&(rainPrev>=0.5||(rh!=null&&rh>=95)||(t!=null&&td!=null&&t-td<1))) up(1,'A',rainPrev>=0.5?'foglie bagnate dalla pioggia':'rugiada sulle foglie');
  if(v!=null){ if(v>20||(g!=null&&g>35)) up(2,'V',`vento ${Math.round(v)} km/h${g!=null?`, raffiche ${Math.round(g)}`:''}`); else if(v>15||(g!=null&&g>25)) up(1,'V',`vento ${Math.round(v)} km/h${g!=null?`, raffiche ${Math.round(g)}`:''}`); else if(v<3) up(1,'U',`vento ${nf(v,1)} km/h: rischio deriva per inversione termica`); }
  if(t!=null){ if(t>30) up(2,'D',`${Math.round(t)} °C`); else if(t>25) up(1,'D',`${Math.round(t)} °C`); else if(t<2) up(2,'T',`${Math.round(t)} °C`); else if(t<5) up(1,'T',`${Math.round(t)} °C`); }
  if(t!=null&&rh!=null){const dt=deltaT(t,rh); if(dt>10) up(2,'F',`aria secca, ΔT ${nf(dt,1)}`); else if(dt>8||(et!=null&&et>0.5)) up(1,'F',dt>8?`aria secca, ΔT ${nf(dt,1)}`:`evapotraspirazione ${nf(et,2)} mm/h`);}
  return {lvl,why,lett:[...L]};
}
function orarioValutato(){
  const F=oreFlat(); return F.map((o,i)=>{const next=(num((F[i+1]||{}).p)||0)+(num((F[i+2]||{}).p)||0);const prev=(num((F[i-1]||{}).p)||0)+(num((F[i-2]||{}).p)||0);return {...o,...valutaOra(o,next,prev)}});
}
function finestre(minH=2){
  const now=new Date(), nowK=today()+'T'+pad(now.getHours());
  const V=orarioValutato().filter(o=>o.k>=nowK); const out=[]; let cur=null;
  V.forEach(o=>{ if(o.lvl===0&&cur&&cur.data===o.data&&o.h===cur.end+1){cur.end=o.h} else if(o.lvl===0){ if(cur) out.push(cur); cur={data:o.data,start:o.h,end:o.h} } else { if(cur) out.push(cur); cur=null } });
  if(cur) out.push(cur);
  return out.filter(w=>w.end-w.start+1>=minH);

  }

  const editing=ui.partEdit&&ui.partEdit.appId===a.id;

  (A.length?`<div class="filters">

  </tbody></table></div>
  <section class="card"><div class="card-h"><h2>Confronto tra appezzamenti · ${ui.fenYear}</h2><span class="muted small">ogni punto è un rilievo</span></div>${fenChart()}</section>`
  :`<div class="card empty"><b>Prima aggiungi gli appezzamenti</b><a class="btn small" href="#appezzamenti">Vai agli appezzamenti</a></div>`);
}
function fenChart(){
  const A=apps(), y=+ui.fenYear;
  const recs=S.fenologia.filter(f=>f.data&&+f.data.slice(0,4)===y);
  if(!recs.length) return `<div class="empty"><span>Nessun rilievo nell'annata ${y}.</span></div>`;
  const x0=new Date(y,2,1), x1=new Date(y,9,31); const L=120,R=20,Wd=860,rowH=34,top=28;
  const H=top+A.length*rowH+10; const sx=d=>L+(parseD(d)-x0)/(x1-x0)*(Wd-L-R);
  const months=['mar','apr','mag','giu','lug','ago','set','ott'];
  let s=`<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:640px" role="img" aria-label="Fasi fenologiche per appezzamento">`;
  months.forEach((m,i)=>{const xx=L+(new Date(y,2+i,1)-x0)/(x1-x0)*(Wd-L-R);s+=`<line x1="${xx}" x2="${xx}" y1="${top-8}" y2="${H-6}" stroke="var(--line)"/><text x="${xx+4}" y="${top-12}" font-size="11" fill="var(--muted)">${m}</text>`});
  A.forEach((a,i)=>{const cy=top+i*rowH+rowH/2;
    s+=`<text x="0" y="${cy+4}" font-size="12" fill="var(--fg)" font-family="var(--f-mono)">${esc(a.codice)}</text><line x1="${L}" x2="${Wd-R}" y1="${cy}" y2="${cy}" stroke="var(--line)" stroke-dasharray="2 4"/>`;
    const rr=recs.filter(r=>r.appId===a.id).sort((p,q)=>p.data.localeCompare(q.data));
    if(rr.length>1) s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" opacity=".5" points="${rr.map(r=>`${sx(r.data).toFixed(1)},${cy}`).join(' ')}"/>`;
    rr.forEach(r=>{const xx=sx(r.data);if(xx<L||xx>Wd-R)return;s+=`<circle cx="${xx.toFixed(1)}" cy="${cy}" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"><title>${esc(a.codice)} · ${fD(r.data)} · ${esc(faseLab(r.fase))}</title></circle><text x="${xx.toFixed(1)}" y="${cy+4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--accent)">${esc(r.fase)}</text>`});
  });
  return `<div class="chart-wrap">${s}</svg></div>`;
}

function matChart(y){
  const all=S.maturazione.filter(m=>m.data&&+m.data.slice(0,4)===y&&num(m.brix)!=null);
  if(all.length<2) return `<div class="empty"><span>Servono almeno due campionamenti con gli zuccheri per disegnare la curva.</span></div>`;
  const ids=uniq(all.map(m=>m.appId)).filter(id=>!ui.matApp||id===ui.matApp);
  const ds=all.map(m=>parseD(m.data).getTime()); const x0=Math.min(...ds)-2*864e5, x1=Math.max(...ds)+2*864e5;
  const bs=all.map(m=>num(m.brix)); let y0=Math.floor(Math.min(...bs)/2)*2-2, y1=Math.ceil(Math.max(...bs)/2)*2+2; if(y0<0)y0=0;
  const Wd=820,H=280,L=44,R=90,T=14,B=30; const sx=t=>L+(t-x0)/(x1-x0)*(Wd-L-R); const sy=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:560px" role="img" aria-label="Curve di accumulo zuccheri">`;
  for(let v=y0;v<=y1;v+=2){s+=`<line x1="${L}" x2="${Wd-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`}
  const step=Math.max(7,Math.round((x1-x0)/864e5/6));
  for(let t=x0+2*864e5;t<=x1;t+=step*864e5){const d=new Date(t);s+=`<text x="${sx(t)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${pad(d.getDate())}/${pad(d.getMonth()+1)}</text>`}
  const labels=[];
  ids.forEach((id,i)=>{const c=SERIES[apps().findIndex(a=>a.id===id)%SERIES.length]||SERIES[i%SERIES.length];
    const pts=all.filter(m=>m.appId===id).sort((a,b)=>a.data.localeCompare(b.data)).map(m=>[sx(parseD(m.data).getTime()),sy(num(m.brix)),m]);
    if(!pts.length)return;
    s+=`<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach((p,k)=>{s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${k===pts.length-1?4.5:3}" fill="${k===pts.length-1?c:'var(--surface)'}" stroke="${c}" stroke-width="2"><title>${esc(appCode(id))} · ${fD(p[2].data)} · ${nf(num(p[2].brix),1)} °Bx</title></circle>`});
    const lp=pts[pts.length-1]; labels.push({y:lp[1],x:lp[0],c,t:`${appCode(id)} ${nf(num(lp[2].brix),1)}`});
  });
  labels.sort((a,b)=>a.y-b.y); for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<14) labels[i].y=labels[i-1].y+14;
  labels.forEach(l=>{s+=`<text x="${Math.min(l.x+8,Wd-R+6)}" y="${l.y+4}" font-size="11.5" font-weight="600" fill="${l.c}" font-family="var(--f-mono)">${esc(l.t)}</text>`});
  return `<div class="chart-wrap">${s}</svg></div>`;
}

function trPreview(){
  const form=modal.querySelector('form[data-form=tr]'); const box=$('#trPrev'); if(!form||!box) return;
  const {fd,lines,appIds}=readTr(form); const vol=fd.get('volume'); const ha=sum(appIds,id=>num((appBy(id)||{}).ettari));
  const W=[]; const out=[`<div><b>${appIds.length} appezzamenti · ${nf(ha,2)} ha</b></div>`];
  const ini=parseD(fd.get('fine')||fd.get('inizio'));
  let car=null,rie=null;
  lines.forEach(l=>{const p=prodBy(l.prodId);if(!p)return;const q=qtyHa(l,vol);
    out.push(`<div>${esc(p.nome)}: ${q!=null?`<span class="mono">${nf(q,2)} ${qtyUnit(l.unita)}/ha · totale ${nf(q*ha,2)} ${qtyUnit(l.unita)}</span>`:(l.unita.includes('hL')?'<span class="w">indica il volume d\'acqua per calcolare il totale</span>':'<span class="muted">indica la dose</span>')}${p.rame&&q!=null?` · <span class="mono">${nf(q*num(p.rame)/100,2)} kg/ha di rame</span>`:''}</div>`);
    if(num(p.doseMax)!=null&&l.dose!=null&&l.unita===p.unita&&l.dose>num(p.doseMax)) W.push(['c',`${esc(p.nome)}: dose sopra il massimo in etichetta (${esc(p.doseMax)} ${esc(p.unita)})`]);
    if(num(p.carenza)!=null&&ini){const u=addDays(ini,num(p.carenza));if(!car||u>car)car=u}
    if(num(p.rientro)!=null&&ini){const u=new Date(ini.getTime()+num(p.rientro)*36e5);if(!rie||u>rie)rie=u}
    const mx=num(p.maxInt); if(mx&&ini){const y=campYear(isoDay(ini));appIds.forEach(id=>{const id0=form.dataset.id;const u=S.trattamenti.filter(t=>t.id!==id0&&t.inizio&&campYear(t.inizio)===y&&(t.appIds||[]).includes(id)&&(t.prodotti||[]).some(x=>x.prodId===p.id)).length+1;if(u>mx)W.push(['c',`${esc(p.nome)} su ${esc(appCode(id))}: sarebbe l'intervento n. ${u}, l'etichetta ne consente ${mx}`])})}
    if(!p.verificato) W.push(['w',`${esc(p.nome)}: dati del prodotto da completare in catalogo`]);
    if(p.bio==='no') W.push(['w',`${esc(p.nome)}: non ammesso in biologico`]);
  });
  if(rie) out.push(`<div>Rientro in campo consentito dal <b class="mono">${fDateT(rie)}</b></div>`);
  if(car) out.push(`<div>Raccolta consentita dal <b class="mono">${fDate(car)}</b></div>`);
  const OPS=fd.getAll('ops').map(opBy).filter(Boolean);
  OPS.forEach(op=>{if(!op.patentino)return;const s=statoScad(op.scadenza);if(s.cls==='crit')W.push(['c',`Patentino di ${esc(op.nome)} scaduto`]);else if(s.cls==='warn')W.push(['w',`Patentino di ${esc(op.nome)} in scadenza`])});
  if(OPS.length&&lines.some(l=>{const p=prodBy(l.prodId);return p&&isFito(p.categoria)})&&!OPS.some(o=>o.patentino&&statoScad(o.scadenza).cls!=='crit')) W.push(['w','Nessuno degli operatori scelti ha un patentino valido']);
  fd.getAll('mezzi').map(attBy).filter(Boolean).forEach(at=>{if(!IRRORATRICI.includes(at.tipo)&&!at.scadenza)return;const s=statoScad(at.scadenza);if(s.cls==='crit')W.push(['c',`Controllo funzionale di ${esc(at.nome)} scaduto`])});
  if(appIds.length&&ini){appIds.forEach(id=>{const a=appBy(id);if(!a)return;const y=ini.getFullYear();let add=0;lines.forEach(l=>{const p=prodBy(l.prodId);if(p&&num(p.rame)){const q=qtyHa(l,vol);if(q!=null)add+=q*num(p.rame)/100}});if(add){const tot=rame7(id,y)+add-(form.dataset.id?0:0);if(tot>28)W.push(['c',`${esc(a.codice)}: con questo trattamento il rame sale a ${nf(tot,1)} kg/ha in 7 anni (limite 28)`])}})}
  box.innerHTML=out.join('')+W.map(([c,t])=>`<div class="${c}">${t}</div>`).join('')+magPreview(lines,ha,vol);
}

async function submitForm(form){
  const k=form.dataset.form, id=form.dataset.id||null, fd=new FormData(form); const o=Object.fromEntries(fd.entries());
  const old=id?(S[{app:'appezzamenti',fen:'fenologia',lav:'lavorazioni',prod:'prodotti',op:'operatori',att:'attrezzature',mat:'maturazione',meteo:'meteo',tr:'trattamenti',mov:'magazzino',conc:'concimazioni',concpar:'appezzamenti'}[k]]||[]).find(x=>x.id===id):null;
  const keep=old&&old.esempio?{esempio:true}:{};
  if(k==='set'){ await put('impostazioni','main',{...settings(),nome:o.nome.trim()||'La mia azienda',inizio:o.inizio}); ui.lavYear=null;ui.expYear=null; toast('Impostazioni salvate'); return; }
  if(k==='app'){ if(num(o.ettari)==null) return toast('Indica la superficie in ettari'); const rec={...(old||{}),...keep,...o,ettari:num(o.ettari)}; if(o.geoUseArea&&old&&old.geoAreaHa!=null) rec.ettari=num(old.geoAreaHa); delete rec.geoUseArea; delete rec.geoRemove; if(o.geoRemove){['geoJson','geoAreaHa','geoNome','geoFonte','geoProps','geoData'].forEach(k=>delete rec[k])} await put('appezzamenti',id,rec); }
  else if(k==='fen'){ await put('fenologia',id,{...keep,...o,perc:num(o.perc)}); ui.fenApp=o.appId; ui.fenYear=+o.data.slice(0,4); }
  else if(k==='fenm'){ const ids=fd.getAll('apps'); if(!ids.length) return toast('Scegli almeno un appezzamento'); for(const a of ids) await put('fenologia',null,{appId:a,data:o.data,fase:o.fase,perc:num(o.perc),rilevatore:o.rilevatore,note:o.note}); ui.fenYear=+o.data.slice(0,4); }
  else if(k==='lav'){
    if(id){ const ap=appBy(o.appId); const ha=o.sup==='parziale'&&num(o.haPar)!=null?num(o.haPar):num(ap&&ap.ettari);
      const om=opMezzoData(fd); await put('lavorazioni',id,{...old,...keep,appId:o.appId,data:o.data,tipo:o.tipo,ha,ore:num(o.ore),...om,operatori:om.operatoreIds.length?'':(old.operatori||''),macchina:om.mezzoIds.length?'':(old.macchina||''),dettagli:o.dettagli}); }
    else { const ids=fd.getAll('apps'); if(!ids.length) return toast('Scegli almeno un appezzamento');
      const has=ids.map(a=>o.sup==='parziale'&&num(o.haPar)!=null&&ids.length===1?num(o.haPar):num((appBy(a)||{}).ettari)||0); const tot=sum(has,x=>x); const gruppo=newId();
      for(let i=0;i<ids.length;i++){ const ore=num(o.ore)!=null&&tot?num(o.ore)*has[i]/tot:null; await put('lavorazioni',null,{appId:ids[i],data:o.data,tipo:o.tipo,ha:has[i],ore:ore!=null?Math.round(ore*100)/100:null,...opMezzoData(fd),dettagli:o.dettagli,gruppo}); }
      if(o.sup==='parziale'&&ids.length>1) toast('Superficie parziale ignorata: vale solo per un appezzamento alla volta'); }

async function doImport(form){
  const kind=form.dataset.kind; let txt=$('#f_txt').value; const f=$('#f_file').files[0]; if(f) txt=await f.text();
  const rows=txt.split(/\r?\n/).map(r=>r.trim()).filter(Boolean).map(r=>r.split(r.includes(';')?';':(r.includes('\t')?'\t':',')).map(c=>c.trim().replace(/^"|"$/g,'')));
  if(!rows.length) return toast('Nessuna riga da importare');
  let n=0;
  if(kind==='app'){ for(const r of rows){ if(num(r[4])==null) continue; const [codice,nome,varieta,col,ett,anno,forma,pi,clone,sesto,comune,foglio,particella]=r;
      await put('appezzamenti',null,{codice,nome,varieta,colore:/ros|ner/i.test(col||'')?'rossa':'bianca',ettari:num(ett),anno,forma,portinnesto:pi,clone,sesto,comune,foglio,particella}); n++; } }
  else { for(const r of rows){ let d=r[0]; const m=d&&d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if(m) d=`${m[3]}-${pad(m[2])}-${pad(m[1])}`; if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')) continue;
      const ex=S.meteo.find(x=>x.data===d); await put('meteo',ex?ex.id:'d'+d,{data:d,tmin:num(r[1]),tmax:num(r[2]),pioggia:num(r[3]),umidita:num(r[4]),fonte:d>today()?'previsione':'osservato'}); n++; } }
  closeModal(); toast(n?`Importate ${n} righe`:'Nessuna riga valida: controlla l\'ordine delle colonne');
}
async function clearExamples(){
  let n=0; for(const c of COLS){ for(const x of S[c].filter(x=>x.esempio)){ await del(c,x.id); n++; } }

let FITO=null, FITOP=null, FITOERR=false;
function loadFito(){
  if(!FITOP) FITOP=fetch('fitofarmaci.json').then(r=>{if(!r.ok)throw new Error('http');return r.json()}).then(d=>{FITO={...d,byReg:new Map(d.prodotti.map(p=>[p.r,p]))};scheduleRender();return FITO}).catch(()=>{FITOERR=true;scheduleRender();return null});
  return FITOP;
}
const regKey=s=>{const d=String(s||'').replace(/\D/g,'');return d?d.padStart(6,'0'):''};
const minValido=st=>!/^(Revocato|Scaduto|Sospeso)/.test(st||'');
const MIN_URL='https://www.fitosanitari.salute.gov.it/fitosanitariws_new/';
function minStato(p){
  if(!isFito(p.categoria)) return null;
  if(!FITO) return {cls:'neutral',txt:FITOERR?'Banca dati non raggiungibile':'Verifica in corso…'};
  const k=regKey(p.reg); if(!k) return {cls:'neutral',txt:'Manca il n. di registrazione'};
  const m=FITO.byReg.get(k); if(!m){const o=FITO.vecchi&&FITO.vecchi[k]; return o?{cls:'crit',txt:`${o[1]}${o[2]?' dal '+fD(o[2]):''}`,m:{n:o[0],st:o[1]}}:{cls:'warn',txt:'N. registrazione non trovato'}}
  if(!minValido(m.st)) return {cls:'crit',txt:`${m.st}${m.rv?' dal '+fD(m.rv):(m.sc?' il '+fD(m.sc):'')}`,m};
  if(m.sc){const g=Math.ceil((parseD(m.sc)-new Date())/864e5); if(g<0) return {cls:'crit',txt:'Autorizzazione scaduta il '+fD(m.sc),m}; return {cls:g<=180?'warn':'ok',txt:'Autorizzato fino al '+fD(m.sc),m}}
  return {cls:'ok',txt:'Autorizzato',m};
}

/* =====================================================================
   DSS – SUPPORTO ALLE DECISIONI PER LA DIFESA
   Modelli orari su dati meteo (meteoOre): peronospora (ciclo primario e
   secondario tipo VitiMeteo-Plasmopara), oidio (indice Gubler-Thomas +
   infezioni ascosporiche), botrite (indice di Broome). Copertura dei
   trattamenti con persistenza e dilavamento. Tutto è ricalcolato nel
   browser a ogni modifica dei dati.
   ===================================================================== */
// punto meteo: dall'azienda (versione multi-utente) o Pollutri (versione personale)
const AZ=()=>window.vingeoAzienda||null;
const DSS_LAT=(AZ()&&AZ().lat!=null)?+AZ().lat:42.1295, DSS_LON=(AZ()&&AZ().lon!=null)?+AZ().lon:14.627;
const luogo=()=>(AZ()&&AZ().comune)||'Pollutri';
const DIS=[['per','Peronospora'],['oid','Oidio'],['bot','Botrite']];
const DISN=Object.fromEntries(DIS);
const P_PER={lesVitaGg:21, dd8:140, germRain:5, germRainH:48, germT:8, germRH:80, germH:8, sopravH:48, dispRain:1, infT:8, infDH:50, infGapH:6, sporRH:92, sporT:12, sporDark:4, secTmin:3, secTmax:29, secDH:50, vitaMaxGg:3};

/* ---------- sole e buio (sporulazione) ---------- */
function euDst(y,m0,d){ // ora legale UE: dall'ultima domenica di marzo all'ultima di ottobre
  const lastSun=(mm)=>{const x=new Date(Date.UTC(y,mm+1,0));return Date.UTC(y,mm,x.getUTCDate()-x.getUTCDay())};
  const t=Date.UTC(y,m0,d); return t>=lastSun(2)&&t<lastSun(9);
}
function sunTimes(day){ // ore locali (decimali) di alba e tramonto a ${luogo()}
  const [y,m,d]=day.split('-').map(Number); const n=Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5);
  const g=2*Math.PI/365*(n-1);
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const eot=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const lat=DSS_LAT*Math.PI/180; const cosH=(Math.cos(90.833*Math.PI/180)/(Math.cos(lat)*Math.cos(decl)))-Math.tan(lat)*Math.tan(decl);
  const H=Math.acos(Math.max(-1,Math.min(1,cosH)))*180/Math.PI;
  const tz=1+(euDst(y,m-1,d)?1:0);
  const noon=(720-4*DSS_LON-eot)/60+tz;
  return {alba:noon-H/15, tramonto:noon+H/15};
}

/* ---------- serie oraria ---------- */
function dssSerie(){
  const now=new Date(), nowK=today()+'T'+pad(now.getHours());
  const days=giorniOrari();
  const H=[]; const sunC={};
  for(const d of days){
    const st=sunC[d.data]||(sunC[d.data]=sunTimes(d.data));
    const ore=[...d.ore].sort((a,b)=>a.h-b.h);
    for(const o of ore){
      const t=num(o.t); if(t==null) continue;
      const rh=num(o.rh), p=num(o.p)||0, td=num(o.td);
      const k=d.data+'T'+pad(o.h);
      const wet=p>=0.2||(rh!=null&&rh>=90)||(rh==null&&td!=null&&t-td<=1.5);
      const mid=o.h+0.5;
      H.push({k,day:d.data,h:o.h,t,rh,p,td,v:num(o.v),et0:num(o.et0),pp:num(o.pp),wet,dark:mid<st.alba||mid>st.tramonto,fc:k>nowK,mod:d.modello||''});

}
function dssGiorni(H){ // aggregati giornalieri
  const m=new Map();

    g.n++;g.ts+=x.t;g.tmin=Math.min(g.tmin,x.t);g.tmax=Math.max(g.tmax,x.t);g.p+=x.p;if(x.wet)g.wetH++;if(x.rh!=null){g.rhs+=x.rh;g.rhn++}if(!x.fc)g.fc=false}
  return [...m.values()].map(g=>({...g,tm:g.ts/g.n,rh:g.rhn?g.rhs/g.rhn:null}));
}

/* ---------- fenologia (registrata o stimata) ---------- */
// soglie di gradi giorno (base 10 dal 1° gennaio) per gruppo di vitigni, tarate sulle fasi dei bollettini
// "Difesa vite" della Regione Abruzzo 2026 (areale litoraneo e di media collina)
const GDD_GRUPPI={
  'precoce':      {C:18,D:32,E:50,F:80,G:110,H:150,I:240,J:330,K:420,L:640,M:1050,N:1400},
  'medio-precoce':{C:18,D:32,E:50,F:85,G:115,H:155,I:280,J:380,K:500,L:610,M:1200,N:1650},
  'medio-tardivo':{C:20,D:36,E:55,F:110,G:150,H:210,I:300,J:440,K:600,L:720,M:1250,N:1950}};
const GDD_FASI=GDD_GRUPPI['medio-tardivo'];
const gruppoFen=a=>{const v=(a&&a.varieta||'').toLowerCase(); if(a&&a.gruppoFen) return a.gruppoFen; if(/chardonnay|pinot|sauvignon|moscato|muller|traminer|falanghina/.test(v)) return 'precoce'; if(/pecorino|passerina|cococciola|malvasia|merlot|trebbiano|montonico|fiano|greco/.test(v)) return 'medio-precoce'; return 'medio-tardivo'};
const CAL_FASI={C:'04-05',D:'04-15',E:'04-25',F:'05-05',G:'05-15',H:'05-25',I:'06-05',J:'06-15',K:'06-25',L:'07-10',M:'08-05',N:'08-25'};
const precoce=a=>/chardonnay|pinot|sauvignon|moscato|pecorino|passerina|falanghina/i.test(a&&a.varieta||'');
function gddSerie(G){ // somma termica base 10 dal 1° gennaio, per giorno
  const out={}; const by={}; for(const g of G){const y=g.day.slice(0,4);(by[y]=by[y]||[]).push(g)}
  for(const y in by){const L=by[y].sort((a,b)=>a.day.localeCompare(b.day)); const full=L[0].day<=y+'-01-10'; let s=0; for(const g of L){s+=Math.max(0,g.tm-10); out[g.day]={gdd:s,full}}}
  return out;
}
function faseStimata(a,day,GDD){
  const y=day.slice(0,4); const g=GDD[day];
  const pre=precoce(a); const thr=GDD_GRUPPI[gruppoFen(a)]||GDD_FASI;
  let f='A';
  if(g&&g.full){for(const l of 'CDEFGHIJKLMN') if(g.gdd>=thr[l]) f=l;}
  else {const md=day.slice(5); const cal={...CAL_FASI}; if(pre){cal.M='07-28';cal.N='08-15'} for(const l of 'CDEFGHIJKLMN') if(md>=cal[l]) f=l;}
  return f;
}
function vendemmiata(appId,day){return S.lavorazioni.some(l=>l.appId===appId&&l.tipo==='Vendemmia'&&l.data&&l.data<=day&&l.data.slice(0,4)===day.slice(0,4))}
function faseApp(a,day,GDD){

  const r=S.fenologia.filter(f=>f.appId===a.id&&f.data&&f.data.slice(0,4)===y&&f.data<=day).sort((p,q)=>p.data.localeCompare(q.data));
  const md=day.slice(5); const haVend=S.lavorazioni.some(l=>l.appId===a.id&&l.tipo==='Vendemmia'&&l.data&&l.data.slice(0,4)===y);
  const post=vendemmiata(a.id,day)||md>='11-15'||md<'02-01'||(!haVend&&md>=(precoce(a)?'09-20':'10-20'));
  if(r.length){const f=r[r.length-1].fase; const st=faseStimata(a,day,GDD); return {f:faseIdx(st)>faseIdx(f)&&daysBetween(r[r.length-1].data,day)>21?st:f,stimata:false,dal:r[r.length-1].data,post}}

/* ---------- PERONOSPORA ---------- */
function incubGiorni(tm){const T=Math.max(8,Math.min(28,tm));return 132.2684985-22.75371914*T+1.608549159*T**2-0.05257104866*T**3+0.0006564062872*T**4}

function peronospora(H,G,GDD,recDay,obsSint){
  const P=P_PER; const ev=[]; const inf=[]; const idx=new Map(H.map((x,i)=>[x.k,i]));
  const gmap=new Map(G.map(g=>[g.day,g]));
  // 1. maturazione oospore: gradi giorno base 8 dal 1° gennaio
  let matIdx=-1, dd=0; const years={};
  for(const g of G){const y=g.day.slice(0,4); if(!years[y]){years[y]={dd:0,full:g.day<=y+'-01-10',mat:null}} const Y=years[y]; Y.dd+=Math.max(0,g.tm-8); if(!Y.mat&&(Y.full?Y.dd>=P.dd8:g.day.slice(5)>='04-10')) Y.mat=g.day}
  // 2. bagnatura della lettiera e germinazione per coorti
  let i=0; const n=H.length; let lastTrig=-999;
  const rain48=new Float64Array(n); {let s=0; for(let j=0;j<n;j++){s+=H[j].p; if(j-P.germRainH>=0) s-=H[j-P.germRainH].p; rain48[j]=s}}
  for(i=0;i<n;i++){
    const x=H[i]; const Y=years[x.day.slice(0,4)]; if(!Y||!Y.mat||x.day<Y.mat) continue;
    if(x.p<0.2||rain48[i]<P.germRain||i-lastTrig<24) continue;
    let ts=0,tn=0; for(let j=Math.max(0,i-P.germRainH+1);j<=i;j++) if(H[j].p>=0.2){ts+=H[j].t;tn++}
    if(!tn||ts/tn<=P.germT) continue;
    lastTrig=i;
    // germinazione: 8 ore favorevoli (T>8, UR>=80 o bagnato) entro 48 h
    let fav=0, gIdx=-1; for(let j=i;j<Math.min(n,i+48);j++){const y=H[j]; if(y.t>P.germT&&((y.rh!=null&&y.rh>=P.germRH)||y.wet)){fav++; if(fav>=P.germH){gIdx=j;break}}}
    if(gIdx<0){ev.push({tipo:'germinazione',i,k:H[i].k,fc:H[i].fc,pioggia:rain48[i],esito:'germinazione non completata'}); continue}
    // dispersione: ora con pioggia >= 2 mm finché le macrozoosporangi sono vivi (48 h)
    let dIdx=-1; for(let j=gIdx;j<Math.min(n,gIdx+P.sopravH);j++){if(H[j].p>=P.dispRain){dIdx=j;break}}
    const coorte={tipo:'germinazione',i:gIdx,k:H[gIdx].k,fc:H[gIdx].fc,pioggia:rain48[i]};
    if(dIdx<0){ev.push({...coorte,esito:'nessuna pioggia per la dispersione'}); continue}
    // infezione: somma di gradi-ora sulle ore bagnate (T>8) >= 50, pause asciutte <= 6 h
    let dh=0,dry=0,jEnd=-1,wetH=0;
    for(let j=dIdx;j<Math.min(n,dIdx+36);j++){const y=H[j]; if(y.wet&&y.t>P.infT){dh+=y.t;wetH++;dry=0; if(dh>=P.infDH&&jEnd<0) jEnd=j} else {dry++; if(dry>P.infGapH) break; if(jEnd>=0) break}}
    if(jEnd<0){ev.push({...coorte,esito:'bagnatura insufficiente'}); continue}
    inf.push({tipo:'primaria',i:jEnd,k:H[jEnd].k,day:H[jEnd].day,fc:H[jEnd].fc,forza:Math.round(dh),bagnH:wetH,tm:Math.round(dh/Math.max(1,wetH)*10)/10,pioggia:Math.round(rain48[i]*10)/10});
    i=Math.max(i,jEnd);
  }
  // 3. incubazione e comparsa dei sintomi
  const incub=(f)=>{let prog=0; let d=parseD(f.day); let last=null;
    for(let k=0;k<40;k++){const ds=isoDay(addDays(d,k)); const g=gmap.get(ds); const tm=g?g.tm:(last!=null?last:null); if(tm==null) return {fine:null,prog}; last=tm; prog+=1/incubGiorni(tm); if(prog>=1) return {fine:ds,prog:1,stimata:!g||g.fc}}
    return {fine:null,prog}};
  inf.forEach(f=>{const r=incub(f); f.sintomi=r.fine; f.sintomiStimati=r.stimata; f.ricettivo=recDay?recDay(f.day):true});
  // 4. ciclo secondario: sporulazione notturna sulle macchie, sopravvivenza sporangi, infezioni
  const spor=[]; const secondarie=[];
  let primoSintomo=null;
  const aggiorna=()=>{const s=[...inf].filter(f=>f.sintomi&&f.ricettivo).map(f=>f.sintomi).sort(); primoSintomo=[s[0],obsSint].filter(Boolean).sort()[0]||null};
  aggiorna();
  if(primoSintomo){
    // macchie attive: ogni infezione su vegetazione recettiva produce macchie che sporulano per circa 3 settimane
    const fin=d=>isoDay(addDays(parseD(d),P.lesVitaGg));
    const macchie=inf.filter(f=>f.sintomi&&f.ricettivo).map(f=>[f.sintomi,fin(f.sintomi)]);
    if(obsSint) macchie.push([obsSint,fin(obsSint)]);

    let finVivi=-1; let run=0;
    for(let j=0;j<n;j++){
      const x=H[j]; if(x.day<primoSintomo){continue}
      if(!attiva(x.day)&&j>finVivi){run=0;continue}
      if(x.dark&&x.rh!=null&&x.rh>=P.sporRH&&x.t>=P.sporT){run++; if(run===P.sporDark){const SD=svp(x.t)*(1-x.rh/100); const vita=Math.min(P.vitaMaxGg,Math.max(0.5,-2.529553487*Math.log(Math.max(SD,0.1))+11.35)); spor.push({i:j,k:x.k,fc:x.fc,vitaGg:Math.round(vita*10)/10}); finVivi=Math.max(finVivi,j+Math.round(vita*24))}}
      else run=0;
      if(j<=finVivi&&x.wet&&x.t>P.secTmin&&x.t<P.secTmax){
        let dh=0,w=0,jEnd=-1,k2=j; for(;k2<n;k2++){const y=H[k2]; if(!(y.wet&&y.t>P.secTmin&&y.t<P.secTmax)) break; dh+=y.t; w++; if(dh>=P.secDH&&jEnd<0) jEnd=k2}
        if(jEnd>=0){const f={tipo:'secondaria',i:jEnd,k:H[jEnd].k,day:H[jEnd].day,fc:H[jEnd].fc,forza:Math.round(dh),bagnH:w,tm:Math.round(dh/w*10)/10}; const r=incub(f); f.sintomi=r.fine; f.sintomiStimati=r.stimata; f.ricettivo=recDay?recDay(f.day):true; secondarie.push(f); if(f.sintomi&&f.ricettivo) macchie.push([f.sintomi,fin(f.sintomi)])}
        j=Math.max(j,k2-1);
      }
    }
  }
  const tutte=[...inf,...secondarie].sort((a,b)=>a.i-b.i);
  return {infezioni:tutte,coorti:ev,spor,anni:years,primoSintomo};
}
const forzaLiv=f=>f>=200?3:f>=100?2:f>=50?1:0;

/* ---------- OIDIO ---------- */
function oidio(H,G){
  const byDay=new Map(); for(const x of H){let d=byDay.get(x.day); if(!d){d={day:x.day,h2130:0,hot:false,fc:x.fc};byDay.set(x.day,d)} if(x.t>=21&&x.t<=30)d.h2130++; if(x.t>=35)d.hot=true; if(!x.fc)d.fc=false}
  const D=[...byDay.values()].sort((a,b)=>a.day.localeCompare(b.day)).filter(d=>d.day.slice(5)>='03-31'&&d.day.slice(5)<'11-01');
  let idx=0, attivo=false, consec=0; const out=[];
  for(const d of D){
    if(!attivo){consec=d.h2130>=6?consec+1:0; if(consec>=3){attivo=true; idx=60}}
    else { if(d.hot) idx-=10; else if(d.h2130>=6) idx+=20; else idx-=10; idx=Math.max(0,Math.min(100,idx)); }
    out.push({day:d.day,indice:attivo?idx:null,ore2130:d.h2130,caldo:d.hot,fc:d.fc});
  }
  // infezioni ascosporiche (fino a fine fioritura): pioggia >= 2,5 mm, T media >= 10 °C, bagnatura lunga
  const asc=[]; let j=0; const n=H.length;
  while(j<n){ if(!H[j].wet){j++;continue}

  for(const [,d,az,pe,wa,cu] of hits){Object.keys(d).forEach(k=>def[k]=1); if(azione==null||ord[az]>ord[azione]){azione=az} pers=Math.max(pers,pe); if(az==='contatto') wash=wash?Math.min(wash,wa):wa; cur=Math.max(cur,cu||0)}

/* coperture per appezzamento e malattia: intervalli [inizio, fine] in chiavi orarie */
function coperture(H){
  const idx=new Map(H.map((x,i)=>[x.k,i]));
  const keyOf=s=>{const d=parseD(s); return d?isoDay(d)+'T'+pad(d.getHours()):null};
  const out={}; // out[appId][dis] = [{da,a,tratt,prodotti,dilavato,mm,azione,curativo}]
  for(const t of S.trattamenti){
    const fine=t.fine||t.inizio; if(!fine) continue; const k0=keyOf(fine); if(!k0) continue;
    const L=(t.prodotti||[]).map(l=>({l,p:prodBy(l.prodId)||l.snap||{}}));
    for(const dk of ['per','oid','bot']){
      const usati=L.map(x=>({...x,pr:propProdotto({...(x.l.snap||{}),...x.p})})).filter(x=>x.pr&&x.pr.bers[dk]);
      if(!usati.length) continue;
      // durata = la più lunga tra i prodotti; dilavamento vale se TUTTI i prodotti attivi sono di copertura
      const pers=Math.max(...usati.map(x=>x.pr.pers)); const soloCont=usati.every(x=>x.pr.azione==='contatto'); const wash=soloCont?Math.min(...usati.map(x=>x.pr.wash)):0;
      const cur=Math.max(0,...usati.map(x=>x.pr.curativo||0));
      let fineK=isoDay(addDays(parseD(fine),pers))+'T'+pad(parseD(fine).getHours());
      let dil=null, mm=0;
      if(wash){ let i0=idx.get(k0); if(i0==null){ i0=H.findIndex(x=>x.k>=k0) } if(i0!=null&&i0>=0){ for(let i=i0+1;i<H.length&&H[i].k<fineK;i++){ mm+=H[i].p; if(mm>=wash){dil=H[i].k; fineK=H[i].k; break} } } }
      for(const a of (t.appIds||[])){ (out[a]=out[a]||{}); (out[a][dk]=out[a][dk]||[]).push({da:k0,a:fineK,tratt:t,prodotti:usati.map(x=>x.p.nome||x.l.snap&&x.l.snap.nome),dilavato:dil,mm:Math.round(mm),azione:soloCont?'contatto':'penetrante',curativo:cur,pers,wash}) }
    }
  }
  return out;
}
function protettoA(cop,appId,dk,k){const L=((cop[appId]||{})[dk]||[]);return L.filter(c=>c.da<=k&&k<c.a).sort((a,b)=>b.a.localeCompare(a.a))[0]||null}
function curataDopo(cop,appId,dk,k){ // trattamento penetrante entro la sua finestra curativa dopo l'infezione

  const m=new Map(R.G.map(g=>[g.day,{day:g.day,p:g.p,fc:g.fc,per:0,perN:0,oid:null,bot:0,asc:0,sint:0}]));

  for(const g of R.oid.giorni){const d=m.get(g.day);if(d)d.oid=g.indice}
  for(const x of R.oid.asc){const d=m.get(x.day);if(d)d.asc++}
  for(const x of R.bot){const d=m.get(x.day);if(d)d.bot=Math.max(d.bot,botLiv(x.indice))}
  return [...m.values()].sort((a,b)=>a.day.localeCompare(b.day));
}

function dssMetodi(R){

  <div class="small" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
   <p><b>Dati.</b> Meteo orario Open-Meteo per ${luogo()} (modello italiano ICON-2I quando disponibile). La bagnatura fogliare non è misurata: un'ora è considerata bagnata con pioggia ≥ 0,2 mm o umidità ≥ 90% (metodo della soglia di umidità). Le ore di buio per la sporulazione sono calcolate da alba e tramonto. ${Y}.</p>
   <p><b>Peronospora</b>, ciclo completo ora per ora, con i parametri del modello VitiMeteo-Plasmopara (Agroscope, versione aperta Plasmopy): maturazione delle oospore a ${P_PER.dd8} gradi-giorno sopra 8 °C dal 1° gennaio; bagnatura della lettiera con ≥ ${P_PER.germRain} mm in ${P_PER.germRainH} h e temperatura sopra ${P_PER.germT} °C; germinazione dopo ${P_PER.germH} ore con T > ${P_PER.germT} °C e UR ≥ ${P_PER.germRH}%; dispersione per schizzi con pioggia ≥ ${P_PER.dispRain} mm in un'ora entro ${P_PER.sopravH} h; infezione quando la somma delle temperature nelle ore bagnate raggiunge ${P_PER.infDH} °C·h (pause asciutte fino a ${P_PER.infGapH} h). Incubazione con la curva di VitiMeteo in funzione della temperatura media giornaliera (circa 19 giorni a 10 °C, 9 a 15 °C, 5 a 20 °C). Dopo le prime macchie: sporulazione con almeno ${P_PER.sporDark} ore di buio, UR ≥ ${P_PER.sporRH}% e T ≥ ${P_PER.sporT} °C; sporangi vivi fino a ${P_PER.vitaMaxGg} giorni secondo il deficit di saturazione; infezioni secondarie con bagnatura tra ${P_PER.secTmin} e ${P_PER.secTmax} °C fino a ${P_PER.secDH} °C·h. Forza dell'infezione: lieve da 50, media da 100, forte da 200 °C·h.</p>
   <p><b>Oidio</b>: infezioni da ascospore fino a fine fioritura con pioggia ≥ 2,5 mm, T media ≥ 10 °C e bagnatura lunga (12 h sotto 15 °C, 8 h sopra), secondo Gadoury e Pearson e la tabella di Mills ridotta; poi indice di rischio Gubler-Thomas (UC Davis): si avvia dopo 3 giorni con almeno 6 ore tra 21 e 30 °C, sale di 20 punti nei giorni favorevoli, scende di 10 negli altri e nei giorni con punte ≥ 35 °C. 60–100 pressione alta (ciclo di 5 giorni), 40–50 media, 0–30 bassa.</p>
   <p><b>Botrite</b>: indice di Broome et al. (1995) per ogni periodo di bagnatura: ln(Y/(1−Y)) = −2,648 − 0,375·W + 0,0616·W·T − 0,00151·W·T², con W ore di bagnatura e T media (12–32 °C). Sotto 0 nessun rischio, 0–0,5 basso, 0,5–1 medio, oltre 1 alto. Conta in fioritura, pre-chiusura grappolo e dall'invaiatura alla raccolta.</p>
   <p><b>Coperture.</b> Ogni trattamento protegge l'appezzamento dalle malattie su cui agiscono i suoi prodotti, riconosciuti dalla sostanza attiva o impostati nella scheda prodotto: i prodotti di copertura durano circa 7 giorni e si dilavano con la pioggia (rame circa 30 mm, zolfo circa 10 mm), i penetranti e sistemici 10–14 giorni e non si dilavano; citotropici e sistemici fermano un'infezione già avvenuta se applicati entro 2–3 giorni. Valori indicativi da letteratura tecnica: verifica sempre l'etichetta.</p>
   <p><b>Fenologia.</b> Usa i rilievi della pagina Fenologia; senza rilievi la fase è stimata dalle somme termiche (base 10 °C) o dal calendario medio della zona. Registrare le fasi rende i modelli molto più precisi.</p>

   <p class="muted">Fonti: Agroscope, Plasmopy / VitiMeteo-Plasmopara (github.com/agroscope-ch/plasmopy); Rossi et al. 2008, Ecological Modelling 212; Gubler et al., UC Davis Powdery Mildew Risk Index (APSnet); Broome et al. 1995, Phytopathology 85:97-102 (UC IPM); Gadoury &amp; Pearson 1990; schede tecniche Wiforagri su persistenza e dilavamento.</p>
  </div></details>`;
}

const umProd=p=>p&&(p.unitaMag||(['L/ha','mL/hL'].includes(p.unita)?'L':'kg'));
function consumiProdotto(pid){ // [{data,qta,unita,fonte,id,label}]
  const out=[];
  for(const t of S.trattamenti){ if(t.esempio||!t.inizio) continue; const ha=trHa(t);
    (t.prodotti||[]).forEach(l=>{ if(l.prodId!==pid) return; const q=qtyHa(l,t.volume); if(q==null||!ha) return; out.push({data:(t.fine||t.inizio).slice(0,16),qta:q*ha,unita:qtyUnit(l.unita),fonte:'trattamento',id:t.id,label:`Trattamento ${(t.appIds||[]).map(appCode).join(', ')}`}) }) }
  for(const c of S.concimazioni){ if(!c.data) continue; const ha=num(c.haTot)!=null?num(c.haTot):sum(c.appIds||[],id=>num((appBy(id)||{}).ettari));
    (c.prodotti||[]).forEach(l=>{ if(l.prodId!==pid) return; const q=concQtyHa(l); if(q==null||!ha) return; out.push({data:c.data,qta:q*ha,unita:l.unita==='L/ha'?'L':'kg',fonte:'concimazione',id:c.id,label:`Concimazione ${(c.appIds||[]).map(appCode).join(', ')}`}) }) }
  return out;
}
function movimentiProdotto(pid){
  const M=S.magazzino.filter(m=>m.prodId===pid&&m.data).map(m=>({...m,fonte:m.tipo,qta:num(m.qta)||0}));
  const C=consumiProdotto(pid).map(c=>({...c,tipo:'consumo'}));
  const all=[...M,...C].sort((a,b)=>a.data.localeCompare(b.data)||(a.tipo==='inventario'?-1:1));
  let g=0; for(const m of all){ if(m.tipo==='carico') g+=m.qta; else if(m.tipo==='inventario') g=m.qta; else g-=m.qta; m.saldo=g }
  return all;
}
function giacenza(pid){const M=movimentiProdotto(pid);const last=M[M.length-1];return {g:last?last.saldo:null,M,haMov:S.magazzino.some(m=>m.prodId===pid)}}
function statoScorta(p){
  const {g,haMov}=giacenza(p.id); const mn=num(p.scortaMin);
  if(!haMov) return {cls:'neutral',txt:'Non a magazzino'};
  if(g<-0.0001) return {cls:'crit',txt:'Consumi oltre la giacenza: verifica'};
  if(g<=0.0001) return {cls:'crit',txt:'Esaurito'};
  if(mn!=null&&g<mn) return {cls:'warn',txt:'Sotto la scorta minima'};
  return {cls:'ok',txt:'Disponibile'};
}

    <td class="act" style="white-space:nowrap">${canWrite?`<button class="btn small" data-act="new-mov" data-v="carico" data-id="${r.p.id}">Carico</button> <button class="btn small" data-act="new-mov" data-v="inventario" data-id="${r.p.id}">Conta</button>`:''}<button class="icon-btn" data-act="mov-hist" data-id="${r.p.id}" title="Movimenti" aria-label="Movimenti">${IC.hist}</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><b>Catalogo vuoto</b><span>Aggiungi prima i prodotti in Trattamenti → Prodotti.</span></div></td></tr>`}

/* =====================================================================
   CONCIMAZIONE: registro, apporti di elementi, piano a dose standard
   (DPI Regione Abruzzo) corretto con vigoria da satellite, produzione,
   sostanza organica e dotazione del suolo; epoche per fase fenologica
   ===================================================================== */
const UNITA_CONC=['kg/ha','q/ha','L/ha','g/hL'];
function concQtyHa(l){const d=num(l.dose); if(d==null) return null; if(l.unita==='q/ha') return d*100; if(l.unita==='g/hL'){const v=num(l.volume); return v==null?null:d*v/100/1000} return d}
function titoli(p){return {N:num(p&&p.titoloN)||0,P:num(p&&p.titoloP)||0,K:num(p&&p.titoloK)||0,Mg:num(p&&p.titoloMg)||0,effN:num(p&&p.effN)!=null?num(p.effN):(p&&p.categoria==='Ammendante'?40:100)}}
function apportiConc(c){ // kg/ha di elementi per una concimazione
  const t={N:0,Nlordo:0,P:0,K:0,Mg:0};
  (c.prodotti||[]).forEach(l=>{const p={...(l.snap||{}),...(prodBy(l.prodId)||{})}; const q=concQtyHa(l); if(q==null) return; const T=titoli(p); t.Nlordo+=q*T.N/100; t.N+=q*T.N/100*T.effN/100; t.P+=q*T.P/100; t.K+=q*T.K/100; t.Mg+=q*T.Mg/100});
  return t;
}
function apportiAnno(appId,y){const s={N:0,Nlordo:0,P:0,K:0,Mg:0,n:0}; for(const c of S.concimazioni){ if(!c.data||+c.data.slice(0,4)!==y||!(c.appIds||[]).includes(appId)) continue; const a=apportiConc(c); for(const k in a) s[k]+=a[k]; s.n++ } return s}

/* vigoria relativa dal satellite: NDVI e NDRE medi tra metà giugno e fine luglio */
function vigoriaApp(appId,y){
  const sel=(id)=>S.vigore.filter(v=>v.appId===id&&v.data&&v.data.slice(0,4)===String(y)&&v.data.slice(5)>='06-15'&&v.data.slice(5)<='07-31');
  const m=(L,k)=>{const xs=L.map(v=>num(v[k])).filter(x=>x!=null);return xs.length?xs.reduce((s,x)=>s+x,0)/xs.length:null};
  const mine=sel(appId); const ndvi=m(mine,'ndvi'), ndre=m(mine,'ndre');
  const all=apps().map(a=>m(sel(a.id),'ndvi')).filter(x=>x!=null).sort((a,b)=>a-b);
  if(ndvi==null||all.length<2) return {classe:null,ndvi,ndre,n:mine.length};
  const med=all[Math.floor(all.length/2)]; const d=ndvi-med;
  return {classe:d>=0.05?'elevata':d<=-0.05?'scarsa':'normale',ndvi,ndre,med,diff:d,n:mine.length};
}

/* scheda a dose standard VITE DA VINO – Regione Abruzzo, DPI 2026, Allegato A (pagg. 143-145) */
const DPI_VITE={rif:'8–12 t/ha',min:8,max:12,
  N:{std:50,maxInc:40},P:{std:{scarsissima:100,scarsa:60,normale:40,elevata:20}},K:{std:{scarsissima:150,scarsa:150,normale:80,elevata:40}},
  allev:{N:[30,50],P:[15,25],K:[20,40]}};
const DPI_FONTE='Scheda di concimazione a dose standard Vite da vino, Disciplinare di produzione integrata Regione Abruzzo 2026 (Allegato A), con le classi di dotazione del terreno della parte generale.';
/* classi di dotazione del terreno per le schede a dose standard (DPI Abruzzo, SILPA modificato GTA) */
const TESS=[['sabbioso','Tendenzialmente sabbioso'],['franco','Franco (medio impasto)'],['argilloso','Tendenzialmente argilloso o limoso']];
function classeSO(v,t){if(v==null)return null;const s={sabbioso:[1.5,2.0],franco:[1.9,2.5],argilloso:[2.3,3.0]}[t||'franco'];return v<s[0]?'scarsa':v>s[1]?'elevata':'normale'}
function classeP(v){if(v==null)return null;return v<5?'scarsissima':v<11?'scarsa':v<=30?'normale':'elevata'}
function classeK(v,t){if(v==null)return null;const s={sabbioso:[40,81,120],franco:[60,101,150],argilloso:[80,121,180]}[t||'franco'];return v<s[0]?'scarsissima':v<s[1]?'scarsa':v<=s[2]?'normale':'elevata'}
function pioggiaInverno(y){ // 1 ottobre dell'anno prima – fine febbraio
  const a=`${y-1}-10-01`, b=`${y}-02-29`; const L=meteoSorted().filter(m=>m.data>=a&&m.data<=b);
  const giorni=Math.round((parseD(`${y}-03-01`)-parseD(a))/864e5);
  return {mm:sum(L,m=>num(m.pioggia)),giorni:L.length,completo:L.length>=giorni-3};
}
function pianoApp(a,y){
  const C=a.conc||{}; const v=vigoriaApp(a.id,y); const fatti=apportiAnno(a.id,y); const D=DPI_VITE;
  const prod=num(C.prodAttesa); const t=C.tessitura||'franco';
  const so=classeSO(num(C.soPerc),t)||C.so||null;
  const dP=classeP(num(C.pOlsen))||C.dotP||null, dK=classeK(num(C.kScamb),t)||C.dotK||null;
  const calcare=num(C.calcareAttivo)!=null?num(C.calcareAttivo)>50:!!C.calcare;
  const righe={N:[],P:[],K:[]}; const add=(el,val,txt)=>righe[el].push([val,txt]);
  // AZOTO
  add('N',0,`Dose standard ${D.N.std} kg/ha per una produzione di ${D.rif}`);
  let inc=0, dec=0; const plus=(x,s)=>{inc+=x;add('N',x,s)}, minus=(x,s)=>{dec+=x;add('N',-x,s)};
  if(prod!=null&&prod>D.max) plus(20,`produzione attesa ${nf(prod,0)} t/ha, superiore a ${D.max} t/ha`);
  if(prod!=null&&prod<D.min) minus(20,`produzione attesa ${nf(prod,0)} t/ha, inferiore a ${D.min} t/ha`);
  if(so==='scarsa') plus(20,'scarsa dotazione di sostanza organica'); if(so==='elevata') minus(20,'elevata dotazione di sostanza organica');
  if(v.classe==='scarsa') plus(20,`scarsa attività vegetativa: NDVI estivo ${nf(v.ndvi,2)} contro ${nf(v.med,2)} della media aziendale`);
  if(v.classe==='elevata') minus(20,`eccessiva attività vegetativa: NDVI estivo ${nf(v.ndvi,2)} contro ${nf(v.med,2)} della media aziendale`);
  if(C.ammendanti) minus(20,'apporto di ammendante nell\'anno precedente');
  const pi=pioggiaInverno(y); if(C.dilavamento||(pi.completo&&pi.mm>300)) plus(15,`forte lisciviazione: ${pi.completo?nf(pi.mm,0)+' mm di pioggia':'piogge abbondanti'} tra ottobre e febbraio`);
  if(inc>D.N.maxInc){add('N',-(inc-D.N.maxInc),`aumento massimo consentito ${D.N.maxInc} kg/ha`);inc=D.N.maxInc}
  let N=D.N.std+inc-dec;
  // FOSFORO
  const cP=dP||'elevata', cK=dK||'elevata';
  let P=D.P.std[cP]; add('P',0,`Dose ${P} kg/ha con dotazione ${cP}${dP?(num(C.pOlsen)!=null?` (P Olsen ${nf(num(C.pOlsen),0)} ppm)`:''):' (senza analisi del terreno si usa la dotazione elevata)'}`);

/* --- geometria: appezzamento che contiene un punto --- */
function puntoIn(poly,lon,lat){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins}return ins}
function appDaPunto(lat,lon){
  let best=null,bd=1e9;
  for(const a of S.appezzamenti){ if(!a.geoJson) continue; let g; try{g=JSON.parse(a.geoJson)}catch(e){continue}
    const P=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
    for(const p of P){ if(puntoIn(p[0],lon,lat)) return {id:a.id,dentro:true,m:0}
      for(const q of p[0]){const d=Math.hypot((q[0]-lon)*111320*Math.cos(lat*Math.PI/180),(q[1]-lat)*110540); if(d<bd){bd=d;best=a.id}} } }
  return best&&bd<150?{id:best,dentro:false,m:Math.round(bd)}:null;
}
/* --- posizione GPS dalla foto (EXIF) --- */
async function exifGps(file){
  try{ const buf=await file.slice(0,262144).arrayBuffer(); const v=new DataView(buf); if(v.getUint16(0)!==0xFFD8) return null;
    let o=2; while(o<v.byteLength-4){ const m=v.getUint16(o); const len=v.getUint16(o+2); if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){ const t=o+10; const le=v.getUint16(t)===0x4949; const u16=p=>v.getUint16(t+p,le), u32=p=>v.getUint32(t+p,le);
        const ifd=(p)=>{const n=u16(p);const out={};for(let i=0;i<n;i++){const e=p+2+i*12;out[u16(e)]={type:u16(e+2),count:u32(e+4),off:e+8}}return out};
        const i0=ifd(u32(4)); if(!i0[0x8825]) return null; const g=ifd(u32(i0[0x8825].off));
        const rat=(ent)=>{const p=u32(ent.off);const r=[];for(let k=0;k<3;k++)r.push(u32(p+k*8)/u32(p+k*8+4));return r[0]+r[1]/60+r[2]/3600};
        if(!g[2]||!g[4]) return null; let lat=rat(g[2]), lon=rat(g[4]);
        if(g[1]&&String.fromCharCode(v.getUint8(t+g[1].off))==='S') lat=-lat; if(g[3]&&String.fromCharCode(v.getUint8(t+g[3].off))==='W') lon=-lon;
        return isFinite(lat)&&isFinite(lon)&&lat!==0?{lat:Math.round(lat*1e6)/1e6,lon:Math.round(lon*1e6)/1e6,fonte:'foto'}:null }
      if((m&0xFF00)!==0xFF00) break; o+=2+len; }
  }catch(e){} return null;
}
async function fotoRidotta(file){
  let bmp; try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}

function catTrap(id){return S.catture.filter(c=>c.trappolaId===id&&c.data).sort((a,b)=>a.data.localeCompare(b.data))}
function settimanale(id,y){ // catture medie giornaliere convertite a settimana per ogni lettura
  const L=catTrap(id).filter(c=>c.data.slice(0,4)===String(y)); const out=[]; let prev=null;
  const T=S.trappole.find(t=>t.id===id); const start=T&&T.installata&&T.installata.slice(0,4)===String(y)?T.installata:null;
  for(const c of L){ const d0=prev?prev.data:(start||null); const gg=d0?Math.max(1,daysBetween(d0,c.data)):7; out.push({data:c.data,n:num(c.n)||0,gg,sett:(num(c.n)||0)/gg*7}); prev=c }

function voli(S7){ // voli: gruppi di letture separati da almeno 2 letture a zero o molto sotto il picco (<45%)
  const V=[]; let cur=null, bassi=0;
  for(const x of S7){
    if(cur){ const basso=x.n===0||x.sett<cur.picco.sett*0.45; if(basso){ bassi++; if(bassi>=2){ cur=null; bassi=0; if(x.n===0) continue } else { cur.tot+=x.n; continue } } else { bassi=0; cur.fine=x.data; cur.tot+=x.n; if(x.sett>cur.picco.sett) cur.picco=x; continue } }

  }

function monGraficoVoli(T,y){
