  geo.forEach(({a,g})=>{(g.type==='MultiPolygon'?g.coordinates:[g.coordinates]).forEach(p=>{s+=`<polygon points="${p[0].map(q=>P(q).join(',')).join(' ')}" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="2"><title>${esc(a.codice)} ${esc(a.nome||'')}</title></polygon>`});
    const c=(g.type==='MultiPolygon'?g.coordinates[0]:g.coordinates)[0]; const cx=c.reduce((s2,q)=>s2+q[0],0)/c.length, cy=c.reduce((s2,q)=>s2+q[1],0)/c.length; const [x,y]=P([cx,cy]); s+=`<text x="${x}" y="${y}" font-size="16" font-weight="700" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke" text-anchor="middle">${esc(a.codice)}</text>`});
  S.rilievi.filter(r=>r.lat&&r.data&&r.data.slice(0,10)>=lim).forEach(r=>{const [x,y]=P([num(r.lon),num(r.lat)]); const i=num(r.intensita)||0; s+=`<circle cx="${x}" cy="${y}" r="7" fill="${i>=3?'#e5484d':i>=2?'#f5a524':'#f7f7f7'}" stroke="#000" stroke-width="1.5"><title>${fD(r.data)} ${esc(tipoRil(r.tipo))}</title></circle>`});
  S.trappole.filter(t=>t.lat).forEach(t=>{const [x,y]=P([num(t.lon),num(t.lat)]); s+=`<g data-act="trap-hist" data-id="${t.id}" style="cursor:pointer"><path d="M${x} ${y} l-8 -16 a9 9 0 1 1 16 0 z" fill="${t.attiva===false?'#999':'#7c3aed'}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y-22}" font-size="13" font-weight="700" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke" text-anchor="middle">${esc(t.codice||'')}</text><title>${esc(t.codice||'')} ${esc(t.nome||'')} · ${esc(t.specie||'')}</title></g>`});
  s+='</svg>';
  return `<div class="mapbox" style="aspect-ratio:${W}/${H}">${or?`<img src="${or.url}" alt="Foto aerea dell'azienda">`:''}${s}${or?`<span class="map-cap">© ${esc(or.attribuzione||'Esri')}</span>`:''}</div>
   <div class="sw-legend" style="margin-top:8px"><span><i style="background:#7c3aed"></i>trappola (tocca per le letture)</span><span><i style="background:#e5484d"></i>rilievo forte</span><span><i style="background:#f5a524"></i>rilievo medio</span><span><i style="background:#f7f7f7;border:1px solid var(--line)"></i>rilievo lieve, ultimi 30 giorni</span></div>`;
}
/* --- integrazione con la difesa e la panoramica --- */
function rilieviMalattia(appId,dk,giorni){const lim=isoDay(addDays(new Date(),-giorni));return S.rilievi.filter(r=>r.appId===appId&&r.data&&r.data.slice(0,10)>=lim&&num(r.intensita)>=1&&(TIPI_RIL.find(t=>t[0]===r.tipo)||[])[2]===dk).sort((a,b)=>b.data.localeCompare(a.data))}
function primaMacchiaOsservata(y){const L=S.rilievi.filter(r=>r.data&&r.data.slice(0,4)===String(y)&&['per-macchie','per-spor','per-grapp'].includes(r.tipo)&&num(r.intensita)>=1).map(r=>r.data.slice(0,10)).sort();return L[0]||null}
function monAlerts(){
  const out=[]; const m=today().slice(5); const stagione=m>='04-01'&&m<='09-30';
  for(const t of S.trappole){ if(t.attiva===false) continue; const c=statoCapsula(t); if(c&&c.scaduta) out.push(['warn',`Trappola ${esc(t.codice||t.nome)}: capsula da cambiare`,`messa ${c.g} giorni fa, dura ${c.dur}`]);
    if(stagione){const C=catTrap(t.id); const last=C[C.length-1]; const g=last?daysBetween(last.data,today()):null; if(g==null||g>8) out.push(['warn',`Trappola ${esc(t.codice||t.nome)} da controllare`,last?`ultima lettura ${g} giorni fa`:'mai letta']) } }
  return out;
}

/* =====================================================================
   BOLLETTINI FITOSANITARI REGIONALI
   Testo dei bollettini "Difesa vite" della Regione Abruzzo
   (agroambiente.regione.abruzzo.it): sezioni, rischio per malattia,
   fasi fenologiche, confronto con i modelli.
   ===================================================================== */
const BOL_SEZ=[['clima',/^IL CLIMA|^AGROMETEO/],['monitoraggio',/^MONITORAGGIO|^AGROFENOLOGIA/],['consigli',/^CONSIGLI SETTIMANALI|^DIFESA$/],['tecnica',/^TECNICA AGRONOMICA|^DPI TECNICHE/],['note',/^NOTE DI DIFESA/],['prodotti',/^D\.?P\.?I\.? DIFESA|^DIFESA BIOLOGICA/]];
const BOL_DIS=[['per',/^(peronospora)\b/i,/peronospora/i],['oid',/^(oidio|mal bianco)\b/i,/oidio/i],['bot',/^(botrite|marciumi)/i,/botrit|marciumi(?! del legno)/i],['tig',/^(tignoletta|lobesia)/i,/tignoletta|lobesia/i],['sca',/^(scafoideo|scaphoideus|flavescenza)/i,/scafoid|scaphoideus/i]];
const BOL_DISN={per:'Peronospora',oid:'Oidio',bot:'Botrite',tig:'Tignoletta',sca:'Scafoideo'};
function bolLivello(fr){ // 0 molto basso … 3 alto, null se la frase non dice un livello
  const t=fr.toLowerCase();
  if(/allerta massima|rischio[^.]{0,40}(elevat|alto\b|molto alto)|(elevat|alto) (il )?rischio|altamente predisponent/.test(t)&&!/medio[- ]alto/.test(t)) return 3;
  if(/medio[- ]basso/.test(t)) return 1;
  if(/medio[- ]alto|rischio[^.]{0,30}medio\b|livello medio\b|attenzione|interventi cautelativi|difesa attenta|si consiglia di intervenire|consigliabile posizionare|intervenire|si interviene|proseguire la difesa|attuare[^.]{0,60}difesa/.test(t)&&!/non si consiglia|non consigliat/.test(t)) return 2;
  if(/molto basso|non si consigli|nessun intervento|non consigliat|conclusa|nessuna infestazione|non si rilevano/.test(t)) return 0;
  if(/medio[- ]basso|rischio[^.]{0,30}bass|abbassan|livello basso/.test(t)) return 1;
  return null;
}
function bolAnalizza(testo){
  const righe=String(testo||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const sez={}; let cur='intro';
  for(const r of righe){ const h=BOL_SEZ.find(([,re])=>re.test(r)&&r.length<70&&r===r.toUpperCase()); if(h){cur=h[0];continue} (sez[cur]=sez[cur]||[]).push(r) }
  const cons=sez.consigli||[]; const rischi={};
  // frase generale ("Rischio peronospora e oidio elevato", "Rischio infezioni fungine molto basso")
  const gen=cons.find(r=>/^rischio /i.test(r)&&r.length<120);
  if(gen){ const l=bolLivello(gen); if(l!=null){ const tutte=/infezion|fungin|general/i.test(gen); for(const [k,,re] of BOL_DIS){ if(k==='tig'||k==='sca') continue; if(tutte||re.test(gen)) rischi[k]={liv:l,frase:gen} } } }
  for(const r of cons){ for(const [k,start] of BOL_DIS){ if(!start.test(r)) continue; const corpo=r.replace(/^[^:]{0,40}:\s*/,''); if(corpo===r&&r.length<40) continue; const l=bolLivello(r); if(l!=null||!rischi[k]) rischi[k]={liv:l??(rischi[k]?rischi[k].liv:null),frase:r} } }
  // 3) note sui patogeni: primo paragrafo sotto il titolo della malattia
  const note=sez.note||[];
  for(const [k,start] of BOL_DIS){ if(rischi[k]) continue; const i=note.findIndex(x=>start.test(x)&&x.length<40); if(i<0) continue; const r=note.slice(i+1,i+3).find(x=>/rischio|allerta/i.test(x)&&bolLivello(x)!=null); if(r) rischi[k]={liv:bolLivello(r),frase:r} }
  // 2) frasi dei consigli che nominano la malattia (es. "Per la peronospora è consigliabile…")
  const frasi=cons.filter(x=>!/^(prodotti per|caratteristiche|mal dell.esca|escoriosi|black rot|fillossera)/i.test(x)).flatMap(x=>x.split(/(?<=[.;])\s+(?=[A-ZÀ-Ý])/));
  for(const [k,,re] of BOL_DIS){ if(rischi[k]) continue; const r=frasi.find(x=>re.test(x)&&bolLivello(x)!=null); if(r) rischi[k]={liv:bolLivello(r),frase:r} }
  if(!Object.keys(rischi).length){ const cg=cons.join(' '); if(/non si consiglia alcun intervento|conclusa la difesa/i.test(cg)||/conclusa la difesa/i.test((sez.note||[]).join(' '))) for(const k of ['per','oid','bot']) rischi[k]={liv:0,frase:(cons.find(r=>/non si consiglia alcun intervento/i.test(r))||'Difesa conclusa per la produzione.')} }
  // fasi fenologiche per gruppo di vitigni
  const mon=sez.monitoraggio||[]; const fasi=[];
  const GR=/(precoci|medio[- ]precoci|medio[- ]tardivi|tardivi)\s*(\([^)]*\))?/gi;
  for(const r of mon){ const m=r.match(/^(?:anche\s+)?(?:i\s+)?vitigni\s+(.*)$/i); if(!m||/tutti in fase/i.test(r)) continue;
    let resto=m[1]; const gr=[]; let g; GR.lastIndex=0; let fine=0;
    while((g=GR.exec(resto))&&resto.slice(fine,g.index).replace(/[\s,e:]/g,'')===''){ gr.push({gruppo:g[1].toLowerCase().replace(' ','-'),esempi:(g[2]||'').replace(/[()]/g,'').trim()}); fine=GR.lastIndex }
    if(!gr.length) continue; const fase=resto.slice(fine).replace(/^[\s,:]+/,'').replace(/^(a|da|in)\s+/i,m=>m).trim();
    for(const x of gr) if(!fasi.some(f=>f.gruppo===x.gruppo)) fasi.push({...x,fase}) }
  const iMon=mon.findIndex(r=>/^monitoraggio vigneti/i.test(r)); const segnalazioni=iMon>=0?mon.slice(iMon+1).filter(r=>!/^(prodotti per|caratteristiche)/i.test(r)).slice(0,6):[];
  const iFen=mon.findIndex(r=>/^fase fenologica/i.test(r)); const fenTesto=iFen>=0?mon.slice(iFen+1,iMon>iFen?iMon:iFen+6).filter(r=>!fasi.some(f=>r.includes(f.fase))):[];
  const pulisci=a=>(a||[]).filter(r=>!/^(prodotti per difesa|caratteristiche dei|dati metereologici|dati climatici settimanali|previsioni del tempo$|le previsioni vanno|elaborazione agridigit)/i.test(r));
  return {sezioni:{clima:pulisci(sez.clima),consigli:pulisci(cons),tecnica:pulisci(sez.tecnica),note:pulisci(sez.note)},rischi,fasi,fenTesto,segnalazioni};
}
const bolData=b=>String(b.data||'').slice(0,10);
function bolAnno(y){ return S.bollettini.filter(b=>bolData(b).slice(0,4)===String(y)).sort((a,b)=>bolData(a).localeCompare(bolData(b))) }
let BOLC={key:null,m:new Map()};
function bolA(b){ const k=b.id+'|'+(b.testo||'').length; if(!BOLC.m.has(k)) BOLC.m.set(k,bolAnalizza(b.testo)); return BOLC.m.get(k) }
function bolUltimo(){ return [...S.bollettini].sort((a,b)=>bolData(b).localeCompare(bolData(a)))[0]||null }
const bolLivTxt=l=>l==null?'—':['molto basso','basso','medio','alto'][l];
const bolCls=l=>l==null?'neutral':['ok','neutral','warn','crit'][l];
function bolRecente(giorni=10){ const b=bolUltimo(); return b&&daysBetween(bolData(b),today())<=giorni?b:null }

// livello del modello nella settimana del bollettino: dal giorno prima dei 7 precedenti fino ai 6 successivi
function modelloSettimana(R,d){
  const a=isoDay(addDays(new Date(d+'T12:00'),-7)), b=isoDay(addDays(new Date(d+'T12:00'),6));
  const AP0=apps(); const attivi=AP0.filter(ap=>!faseApp(ap,d,R.GDD).post); if(AP0.length&&!attivi.length) return {per:null,oid:null,bot:null,post:true};
  const grappoloOid=!AP0.length||attivi.some(ap=>recettivo.oidGrappolo(faseApp(ap,d,R.GDD).f));
  // peronospora: conta forza e frequenza delle infezioni su vegetazione recettiva (1 debole = basso; 1 media o 2 = medio; 1 forte o 3+ = alto)
  const pi=R.per.infezioni.filter(x=>x.day>=a&&x.day<=b&&x.ricettivo!==false); const pf=pi.reduce((m,x)=>Math.max(m,forzaLiv(x.forza)),0);
  const per=!pi.length?0:Math.min(3,Math.max(pf,pi.length>=3?3:pi.length===2?2:1));
  const og=R.oid.giorni.filter(x=>x.day>=a&&x.day<=b&&x.indice!=null); let oid=og.length?oidLiv(Math.round(og.reduce((s,x)=>s+x.indice,0)/og.length)):0; if(!grappoloOid) oid=Math.min(oid,1); // dopo l'invaiatura il grappolo non è più sensibile
  const AP=apps(); const bot=R.bot.filter(x=>x.day>=a&&x.day<=b&&(!AP.length||AP.some(ap=>recettivo.bot(faseApp(ap,x.day,R.GDD).f)))).reduce((m,x)=>Math.max(m,botLiv(x.indice)),0);
  return {per,oid,bot};
}
function bolConfronto(R,y){
  return bolAnno(y).map(b=>{const A=bolA(b); const M=modelloSettimana(R,bolData(b)); return {b,A,M}});
}
function bolCard(R){
  const b=bolUltimo();
  if(!b) return `<p class="muted small">Nessun bollettino caricato. I bollettini "Difesa vite" della Regione Abruzzo escono di norma ogni martedì da marzo a settembre.</p>`;
  const A=bolA(b); const g=daysBetween(bolData(b),today()); const vecchio=g>10;
  const chips=['per','oid','bot','tig','sca'].filter(k=>A.rischi[k]).map(k=>`<span class="bol-chip"><span class="muted small">${BOL_DISN[k]}</span> ${livPill(bolCls(A.rischi[k].liv),A.rischi[k].liv==null?'vedi testo':bolLivTxt(A.rischi[k].liv))}</span>`).join('');
  const fasi=A.fasi.length?`<div class="bol-fasi">${A.fasi.map(f=>`<div><span class="muted small">${esc(f.gruppo.replace('-',' '))}${f.esempi?' · '+esc(f.esempi):''}</span><div class="small">${esc(f.fase)}</div></div>`).join('')}</div>`:'';
  const lista=(t,a,n=99)=>a&&a.length?`<details class="bol-sec"><summary>${t}</summary>${a.slice(0,n).map(r=>`<p class="small">${esc(r)}</p>`).join('')}</details>`:'';
  return `<div class="bol">
   <div class="bol-h"><div><b>${esc(b.titolo||'Bollettino')}</b><div class="muted small">Regione Abruzzo · Difesa vite · ${fD(bolData(b))}${vecchio?` · <b>${g} giorni fa</b>${+today().slice(5,7)>=10||+today().slice(5,7)<=2?' (stagione dei bollettini chiusa)':''}`:''}</div></div>${b.url?`<a class="btn small" href="${esc(b.url)}" target="_blank" rel="noopener">Apri l'originale</a>`:''}</div>
   ${chips?`<div class="bol-chips">${chips}</div>`:''}
   ${A.rischi.per||A.rischi.oid?`<div class="small">${uniq(['per','oid','bot','tig'].filter(k=>A.rischi[k]&&A.rischi[k].frase).map(k=>A.rischi[k].frase)).map(fr=>`<p>${esc(fr)}</p>`).join('')}</div>`:''}
   ${fasi}
   ${A.segnalazioni.length?`<div class="small"><b>Dalla rete di monitoraggio:</b> ${esc(A.segnalazioni.slice(0,3).join(' '))}</div>`:''}
   ${lista('Consigli di difesa completi',A.sezioni.consigli)}${lista('Clima e previsioni',A.sezioni.clima)}${lista('Tecnica agronomica',A.sezioni.tecnica)}${lista('Note sui patogeni',A.sezioni.note,40)}
   <p class="muted small">Fonte: Regione Abruzzo, AgroAmbiente. Il bollettino vale per l'areale litoraneo e di media collina: confrontalo con i modelli calcolati sul meteo di ${luogo()} e con i tuoi rilievi.</p>
  </div>`;
}
function bolConfrontoHtml(R){
  const y=ui.dssYear||new Date().getFullYear(); const C=bolConfronto(R,y);
  if(!C.length) return `<p class="muted small">Nessun bollettino per il ${y}.</p>`;
  const cell=(mod,bol)=>{ if(mod==null) return `<td>${bol!=null?livPill(bolCls(bol),bolLivTxt(bol)):''} <span class="muted small">modello: dopo vendemmia</span></td>`; if(bol==null) return `<td>${livPill(bolCls(mod),bolLivTxt(mod))} <span class="muted small">bollettino: —</span></td>`;
    const d=mod-bol; const seg=d>=2?'↑↑':d===1?'↑':d===0?'=':d===-1?'↓':'↓↓';
    return `<td><div class="bol-cmp"><span class="muted small">bollettino</span>${livPill(bolCls(bol),bolLivTxt(bol))}<span class="muted small">modello</span>${livPill(bolCls(mod),bolLivTxt(mod))}<b title="modello rispetto al bollettino" class="${Math.abs(d)>=2?'bol-dis':''}">${seg}</b></div></td>` };
  // sintesi
  const tot={per:[0,0,0],oid:[0,0,0]}; for(const {A,M} of C) for(const k of ['per','oid']){ const r=A.rischi[k]; if(!r||r.liv==null||M[k]==null) continue; const d=M[k]-r.liv; tot[k][d>0?0:d<0?2:1]++ }
  const sint=k=>{const [su,ug,giu]=tot[k]; const n=su+ug+giu; return n?`${BOL_DISN[k]}: modello più alto in ${su} settimane, uguale in ${ug}, più basso in ${giu} su ${n}.`:''};
  return `<p class="small">${[sint('per'),sint('oid')].filter(Boolean).join(' ')} <span class="muted">Il livello del modello considera i 7 giorni prima e i 6 dopo la data del bollettino: per la peronospora conta forza e numero delle infezioni calcolate, per l'oidio la media dell'indice di Gubler (dopo l'invaiatura al massimo "basso", perché il grappolo non è più sensibile), per la botrite l'indice di Broome più alto nelle fasi sensibili.</span></p>
  <div class="tbl-wrap"><table style="min-width:760px"><thead><tr><th>Bollettino</th><th>Peronospora</th><th>Oidio</th><th>Botrite</th><th>Fase (bollettino)</th></tr></thead><tbody>
  ${C.slice().reverse().map(({b,A,M})=>`<tr><td><b>${fDs(bolData(b))}</b><div class="muted small">${esc((b.titolo||'').replace(/^Bollettin[io]\s*/i,'').replace(/\s+del.*$/,''))}</div></td>${cell(M.per,A.rischi.per?A.rischi.per.liv:null)}${cell(M.oid,A.rischi.oid?A.rischi.oid.liv:null)}${cell(M.bot,A.rischi.bot?A.rischi.bot.liv:null)}<td class="small">${esc((A.fasi.find(f=>/tardiv/.test(f.gruppo))||A.fasi[0]||{fase:''}).fase).slice(0,90)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function bolNotaDisease(dk){ const b=bolRecente(10); if(!b) return ''; const r=bolA(b).rischi[dk]; if(!r) return ''; return `<div class="small bol-nota">Bollettino del ${fDs(bolData(b))}: ${livPill(bolCls(r.liv),r.liv==null?'vedi testo':'rischio '+bolLivTxt(r.liv))}</div>` }

/* ===================== avvio ===================== */
async function init(){
  if(window.vingeoPronto){ try{ await window.vingeoPronto }catch(e){ console.error(e) } }
  route();
  const C=window.claude;
  if(!C||!C.use){ mode='local'; render(); return; }
  try{ db=await C.use('db'); }catch(e){ db=null; } assetsPronti();
  if(!db){ mode='local'; render(); return; }
  mode='db';
  try{ const u=await C.use('user'); if(u&&u.can){ const c=await u.can('data.write'); if(c===false) canWrite=false; } }catch(e){}
  for(const c of COLS){
    db.collection(c).onSnapshot(snap=>{ S[c]=snap.docs.map(d=>({id:d.id,...d.data()})); loaded.add(c); scheduleRender(); },
      err=>{ loaded.add(c); if(err&&err.code==='revoked'){canWrite=false} scheduleRender(); });
  }
  C.use('downloads').then(d=>{dl=d}).catch(()=>{});
}
init();
</script>
